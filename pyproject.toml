[project]
name = "search-agent"
version = "0.1.0"
description = "Paper search and summarization agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.0",
    "google-genai>=2.9.0",
    "ollama>=0.6.2",
    "openreview-py>=2.2.3",
    "pyalex>=0.21",
    "pypdf>=6.14.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
]
