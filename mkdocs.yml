site_name: Paper Cards
site_description: Collection of high-level paper cards
site_url: https://woojin716.github.io/search_agent/
docs_dir: cards

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  features:
    - navigation.tabs        # top tabs = folders
    - navigation.sections    # papers as sidebar sections
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - md_in_html        # render Markdown inside <div markdown>
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - awesome-pages   # control tab/folder order via cards/.pages
  - tags   # tag listing renders at the <!-- material/tags --> marker in tags.md
